[package]
name = "paper-calendar"
version = "0.1.0"
edition = "2021"
description = "An e-ink CalDAV calendar and reminder dashboard for PocketBook"
repository = "https://github.com/meshchaninov/paper-calendar"
keywords = ["caldav", "pocketbook", "eink", "calendar", "reminders"]
categories = ["date-and-time"]

[dependencies]
anyhow = "1"
axum = "0.6"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
ical = "0.11"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }
resvg = "0.45"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[dependencies.libloading]
version = "0.8"
optional = true

[features]
pocketbook = ["dep:libloading"]
